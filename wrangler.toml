#:schema node_modules/wrangler/config-schema.json
name = "procom27frontend"
main = "./worker.js"
compatibility_date = "2024-12-01"

[build]
command = "npm install && npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# "none" sends a request with no matching file to worker.js, which serves the
# app shell to page navigations and a real 404 to everything else. The
# "single-page-application" setting answered every missing file, even a
# script or an image, with index.html and a 200.
not_found_handling = "none"

[previews]
